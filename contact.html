<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — tpmsush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="site-title">tpmsush</h1>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="resume.html">Resume</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Contact Me</h2>
      <form id="contactForm" novalidate>
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="email">Your email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Write a short message" required></textarea>

        <button type="submit">Send Message</button>
        <p id="formMessage" class="form-message" aria-live="polite"></p>
      </form>
      <p class="note">Note: This is a static site. Form submission is simulated with JavaScript (no backend).</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 tpmsush</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
